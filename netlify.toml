[build]
  publish = "."

# Static site — no build step. Netlify serves the files as-is.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# The register page posts here. Same origin, so it stays inside connect-src 'self'.
[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

# The welcome page posts the token from the confirmation email here.
[[redirects]]
  from = "/api/confirm"
  to = "/.netlify/functions/confirm"
  status = 200

# Signing in and out. Server-side so Identity's cookies are set by the
# Functions runtime; the pages navigate with a full page load afterwards.
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

# The checkout reserves its payment amount here, and declares the transfer
# through /api/claim. Both need a session, so both are same-origin.
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200

[[redirects]]
  from = "/api/claim"
  to = "/.netlify/functions/claim"
  status = 200

# The authoritative subscription state. Every page that shows or hides
# something based on what the visitor has paid for reads this.
[[redirects]]
  from = "/api/subscription"
  to = "/.netlify/functions/subscription"
  status = 200

# Whether payment confirmation is actually running. Worth a bookmark: an
# expired MEXC key breaks nothing a visitor can see.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Maintainer notes live in the publish root because there is no build step to
# move them out of it. They are not part of the product, so they are not served:
# an agent orientation file is a poor search result and a worse first impression.
[[redirects]]
  from = "/AGENTS.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.local.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/email-templates/README.md"
  to = "/index.html"
  status = 404
  force = true

# Friendly URLs
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/signin.html"
  status = 200

[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
